<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neko Raw API - Manager</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --sidebar-bg: #f7f7f7;
            --border-color: #e0e0e0;
            --accent-color: #ff5f56;
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* macOS Controls มุมซ้ายบน */
        .window-controls {
            position: absolute;
            top: 16px;
            left: 16px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }
        .mac-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .btn-close { background-color: #ff5f56; border: 1px solid #e0443e; }
        .btn-minimize { background-color: #ffbd2e; border: 1px solid #dea123; }
        .btn-maximize { background-color: #27c93f; border: 1px solid #1aab29; }

        /* หน้าจอต่างๆ (Views) */
        .view {
            display: none;
            width: 100%;
            height: 100vh;
            box-sizing: border-box;
            padding-top: 40px;
        }
        .view.active {
            display: flex;
        }

        /* หน้า Login */
        #login-view {
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .login-box {
            background: #fafafa;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 300px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* หน้า Dashboard & Editor */
        #dashboard-view {
            flex-direction: row;
        }
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
